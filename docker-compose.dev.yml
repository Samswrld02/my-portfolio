services:
  frontend:
    image: node:24
    container_name: portfolio_sam_frontend
    working_dir: /app
    volumes:
      - ./Frontend/next:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    networks:
      - portfolio-network
    environment:
      - NEXT_PUBLIC_API_BASE=

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: portfolio_sam_backend
    volumes:
      - ./Backend:/app
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - portfolio-network

  db:
    image: mariadb:10.11
    container_name: portfolio_sam_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - portfolio-network

  caddy:
    build:
      context: ./Caddy
      dockerfile: Dockerfile
    container_name: portfolio_sam_caddy
    ports:
      - "80:80"
    networks:
      - portfolio-network
    depends_on:
      - frontend
      - backend

networks:
  portfolio-network:
    driver: bridge

volumes:
  db_data:
